[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dadnovin-backend"
version = "0.1.0"
description = "Dadnovin legal group — FastAPI backend (admin CMS, consultations, tickets, AI assistant)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy[asyncio]==2.0.44",
    "alembic==1.17.2",
    "asyncpg==0.31.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "argon2-cffi==25.1.0",
    "pillow==13.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.31",
    "email-validator==2.3.0",
    "cryptography==50.0.0",
    "segno==1.6.6",
    "arabic-reshaper==3.0.1",
    "python-bidi==0.6.12",
    "nh3==0.3.7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.1",
    "aiosqlite==0.21.0",
    "ruff==0.14.5",
    "zxing-cpp==3.1.1",
]

[tool.setuptools.packages.find]
include = ["main*"]

[tool.setuptools.package-data]
"main.assets.fonts" = ["*.ttf"]

[tool.fastapi]
entrypoint = "main.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
