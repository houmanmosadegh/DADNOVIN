[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dadnovin-backend"
version = "0.1.0"
description = "Dadnovin legal group — FastAPI backend (admin CMS, consultations, tickets, AI assistant)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.124.4",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy[asyncio]==2.0.44",
    "alembic==1.17.2",
    "asyncpg==0.31.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "argon2-cffi==25.1.0",
    "pillow==12.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "email-validator==2.3.0",
    "cryptography==43.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "aiosqlite==0.21.0",
    "ruff==0.14.5",
]

[tool.setuptools.packages.find]
include = ["main*"]

[tool.fastapi]
entrypoint = "main.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
