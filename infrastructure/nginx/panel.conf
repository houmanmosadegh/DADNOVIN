# Admin panel — vite build served under /panel (base=/panel/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf font/otf;

    # admin UI must never be indexed
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = / {
        return 302 /panel/;
    }
    location = /panel {
        return 301 /panel/;
    }

    location /panel/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # SPA fallback — direct navigation/refresh on /panel/* serves index.html
    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    location / {
        return 404;
    }
}
