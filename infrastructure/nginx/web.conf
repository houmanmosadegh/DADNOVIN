# Public website — static SPA with prerendered per-route HTML.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf font/otf application/wasm;

    # long-cache fingerprinted build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # پنل کاربر: اپ client-only — شل خالی (بدون hydrate روی مارک‌آپ پرِندرشده)
    location ^~ /panel {
        try_files $uri /spa.html;
    }

    # prerendered routes live as <route>/index.html — serve them directly
    # (no trailing-slash redirect hop), then /index.html as SPA fallback.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # security headers — CSP tuned for the WebGL/three.js site
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
