# Edge gateway — routes / → web, /panel → panel, /api|/docs → api.
# In production terminate TLS in front of this (or extend this server).
upstream api_upstream { server api:8000; }
upstream web_upstream { server web:8080; }
upstream panel_upstream { server panel:8080; }

server {
    listen 8080;
    server_name _;

    client_max_body_size 8m;

    # shared proxy headers — $http_host keeps the port so app redirects stay valid
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # FastAPI — api + docs + media files all live under the api service
    location /api/ {
        proxy_pass http://api_upstream;
    }
    location = /openapi.json {
        proxy_pass http://api_upstream;
    }
    location ~ ^/(docs|redoc) {
        proxy_pass http://api_upstream;
    }

    # admin SPA (noindex handled downstream too)
    location /panel {
        proxy_pass http://panel_upstream;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # public website
    location / {
        proxy_pass http://web_upstream;
    }
}
