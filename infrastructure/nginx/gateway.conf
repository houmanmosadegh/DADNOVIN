# Edge gateway — routes / → web, /panel → panel, /api|/docs → api.
# In production terminate TLS in front of this (or extend this server).
server {
    listen 8080;
    server_name _;

    client_max_body_size 8m;

    # Docker DNS — upstream containers get fresh IPs on recreate, so resolve
    # per-request via variables (static upstreams cache stale IPs).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # shared proxy headers — $http_host keeps the port so app redirects stay valid
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # FastAPI — api + docs + media files all live under the api service
    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
    }
    location = /openapi.json {
        set $upstream http://api:8000;
        proxy_pass $upstream;
    }
    location ~ ^/(docs|redoc) {
        set $upstream http://api:8000;
        proxy_pass $upstream;
    }

    # admin SPA (noindex handled downstream too)
    location /panel {
        set $upstream http://panel:8080;
        proxy_pass $upstream;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # public website
    location / {
        set $upstream http://web:8080;
        proxy_pass $upstream;
    }
}
